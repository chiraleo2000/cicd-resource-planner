name: CI — Validate & Compliance Gate

# ด่านตรวจของ repo นี้: ตรวจความถูกต้องของโมเดล -> ตรวจว่า catalog.json สดใหม่
# -> ตรวจ compliance ของแผนที่ commit ไว้ -> สร้าง artifact (Excel + standalone HTML)
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: ตรวจความถูกต้องของโมเดลและข้อมูล
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ติดตั้ง dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: ตรวจว่า data/catalog.json ตรงกับ source
        run: |
          python3 scripts/build_catalog.py
          if ! git diff --quiet -- data/catalog.json; then
            echo "::error::data/catalog.json ไม่ตรงกับ scripts/catalog_data.py — รัน python3 scripts/build_catalog.py แล้ว commit ใหม่"
            git --no-pager diff --stat -- data/catalog.json
            exit 1
          fi
          echo "catalog.json สดใหม่"

      - name: ตรวจ JSON syntax และ schema เบื้องต้น
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data/catalog.json', encoding='utf-8'))
          need = {'schema_version','model','freq_classes','capabilities','license_classes',
                  'control_groups','controls','framework_families','frameworks',
                  'framework_presets','profiles','tools','archetypes','stages','conc_groups'}
          missing = need - set(d)
          assert not missing, f'catalog.json ขาด key: {missing}'
          assert d['tools'] and d['controls'] and d['frameworks'], 'catalog ว่างบางส่วน'
          for f in d['freq_classes']:
              assert 0.50 - 1e-9 <= f['weight'] <= 0.95 + 1e-9, \
                  f"น้ำหนักของ {f['id']} = {f['weight']} หลุดช่วง 50-95% ที่กำหนด"
          ids = {c['id'] for c in d['controls']}
          for fw in d['frameworks']:
              bad = [c for c in fw['controls'] if c not in ids]
              assert not bad, f"{fw['id']} อ้างมาตรการที่ไม่มี: {bad}"
              assert fw['region'] in ('th','intl'), f"{fw['id']} region ผิด"
          nth = sum(1 for f in d['frameworks'] if f['region']=='th')
          print(f"catalog OK: {len(d['tools'])} tools / {len(d['controls'])} controls / "
                f"{len(d['frameworks'])} frameworks ({nth} ไทย, {len(d['frameworks'])-nth} สากล)")
          PY

      - name: รัน verification suite (Python <-> JavaScript parity)
        run: python3 scripts/verify.py

      - name: ตรวจ syntax และข้อห้ามของ JavaScript
        run: |
          for f in assets/*.js; do node --check "$f"; echo "syntax OK: $f"; done
          node scripts/lint_frontend.mjs

      - name: ตรวจว่า index.html ไม่มี dependency ภายนอก
        run: |
          python3 - <<'PY'
          import re
          h = open('index.html', encoding='utf-8').read()
          bad = [u for u in re.findall(r'(?:src|href)="([^"]+)"', h)
                 if u.startswith(('http://', 'https://', '//'))]
          assert not bad, f'index.html อ้างอิงภายนอก (ผิดข้อกำหนด Air-gapped): {bad}'
          print('index.html ผ่านการตรวจ')
          PY

  # ---------------------------------------------------------------------------
  compliance-gate:
    name: Compliance & Resource Gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt

      - name: ตรวจผังอ้างอิงทุกผัง (ต้องผ่าน 100% ไม่งั้น build fail)
        run: |
          python3 scripts/check_compliance.py "plans/arch-*.json" \
            --summary "$GITHUB_STEP_SUMMARY" --json-out compliance-archetypes.json

      - name: ตรวจแผนของโครงการที่เพิ่มเข้ามาเอง (ถ้ามี)
        run: |
          shopt -s nullglob
          extra=(plans/*.json)
          own=()
          for f in "${extra[@]}"; do
            case "$(basename "$f")" in arch-*|_template.json) ;; *) own+=("$f");; esac
          done
          if [ ${#own[@]} -eq 0 ]; then
            echo "ยังไม่มีแผนของโครงการเพิ่มเติมใน plans/ — ข้ามขั้นนี้"
          else
            python3 scripts/check_compliance.py "${own[@]}" \
              --summary "$GITHUB_STEP_SUMMARY" --json-out compliance-projects.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: compliance-*.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  build-artifacts:
    name: สร้าง Excel และ HTML แบบ Standalone
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt

      - name: สร้างไฟล์ Excel (ตารางเครื่องมือ + เครื่องคำนวณ)
        run: python3 scripts/build_xlsx.py dist/CICD_Tool_Resource_Matrix.xlsx

      - name: สร้าง HTML แบบไฟล์เดียวสำหรับเครือข่าย Air-gapped
        run: python3 scripts/build_standalone.py dist/planner-standalone.html

      - name: ตรวจว่าไฟล์ Excel เปิดได้และมีชีทครบ
        run: |
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('dist/CICD_Tool_Resource_Matrix.xlsx')
          need = ['01_Tool_Catalog','02_Freq_Weight','03_Colocation_Calc','04_VM_Sizing',
                  '05_Params','06_Storage_LongTerm','07_Compliance_Matrix',
                  '08_Tool_Capability','09_Profile_Comparison','10_Archetypes','11_Frameworks']
          missing = [n for n in need if n not in wb.sheetnames]
          assert not missing, f'ชีทที่ขาดไป: {missing}'
          print('ชีทครบ:', wb.sheetnames)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cicd-planner-dist
          path: |
            dist/CICD_Tool_Resource_Matrix.xlsx
            dist/planner-standalone.html
          retention-days: 90
